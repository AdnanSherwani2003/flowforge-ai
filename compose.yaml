name: flowforge-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowforge_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: postgres
      FLOWFORGE_DB_PASSWORD: ${FLOWFORGE_DB_PASSWORD:?required}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d postgres
          && psql -U "$$POSTGRES_USER" -d postgres -tAc
          "SELECT count(*) FROM pg_database WHERE datname
          IN ('flowforge', 'flowforge_n8n')"
          | grep -q '^2$$'
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge_app
      POSTGRES_PASSWORD: ${FLOWFORGE_DB_PASSWORD:?required}
      DATABASE_URL: postgresql+psycopg://flowforge_app:${FLOWFORGE_DB_PASSWORD:?required}@postgres:5432/flowforge
      ENABLE_FAILURE_SIMULATION: "${FLOWFORGE_ENABLE_SIMULATION:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.43.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: flowforge_n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      WEBHOOK_URL: http://localhost:5679/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      TZ: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Future executions do not retain raw node payloads. Preserve historical records.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "none"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
